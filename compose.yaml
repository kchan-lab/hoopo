# ローカル開発環境(portal=8000 / admin=8001)。手順は docs/LOCAL_DEV.md
# DB は Supabase CLI のローカルスタックを使う: pnpm exec supabase start(このファイルには含めない)
name: hoopo

# portal / admin 共通の開発コンテナ設定(Compose Spec の extension フィールド + YAML アンカー)
x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - pnpm_store:/app/.pnpm-store
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
  env_file:
    - path: .env
      required: false
  # コンテナ内から Supabase ローカルスタック(ホスト側ポート)へ届くように
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # 依存インストールを一度だけ行う one-shot サービス(#68)。
  # portal / admin / playwright が同時に pnpm install を走らせると共有の node_modules
  # ボリューム上で競合して片方が落ちるため、ここで直列化してから各サービスを起動する。
  # `docker compose up` は終了済みの one-shot も再実行するので、依存を追加したら up し直せばよい
  deps:
    <<: *app-base
    command: pnpm install --frozen-lockfile
    restart: "no"

  portal:
    <<: *app-base
    command: pnpm --filter @hoopo/portal dev
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  admin:
    <<: *app-base
    command: pnpm --filter @hoopo/admin dev
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # E2E 実行用。profiles で分けてあるので make dev では起動せず、
  # 約2GB の公式イメージは E2E を実際に回すときだけ取得される。
  # ブラウザ依存をホスト(WSL2)に入れないための構成(CLAUDE.md ローカル開発は Docker で統一)。
  # イメージのタグは @playwright/test のバージョンと必ず一致させる(ズレると起動時にエラーになる)
  playwright:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/app/.pnpm-store
    environment:
      # コンテナ間はサービス名で解決する(ホストの localhost ではない)
      PORTAL_URL: http://portal:8000
      ADMIN_URL: http://admin:8001
      CI: "1"
    depends_on:
      deps:
        condition: service_completed_successfully
      portal:
        condition: service_healthy
      admin:
        condition: service_healthy
    # 依存は deps が入れ済み。pnpm 本体だけこのイメージに無いので入れる
    command: sh -c "npm install -g pnpm@11.18.0 && pnpm exec playwright test"

volumes:
  node_modules:
  pnpm_store:
