# ローカル開発環境(portal=8000 / admin=8001)。手順は docs/LOCAL_DEV.md
# DB は Supabase CLI のローカルスタックを使う: pnpm exec supabase start(このファイルには含めない)
services:
  portal:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @hoopo/portal dev"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env
        required: false

  admin:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @hoopo/admin dev"
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env
        required: false

volumes:
  node_modules:
  pnpm_store:
