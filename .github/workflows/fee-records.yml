# 月次の fee_record 自動生成ジョブ(Issue #15 / fees/plan.md 設計判断5)。
# 毎月1日の 00:10 JST に、全チームの有効な部員へ当月の「未」レコードを冪等に作る
# (DB 関数 generate_current_fee_records。SECURITY DEFINER なのでアプリロールで呼べる)。
# 接続文字列は Supabase ping と同じシークレットを流用する(hoopo_app 系ロール)
name: Fee records

on:
  schedule:
    - cron: "10 15 1 * *" # 毎月1日 00:10 JST(Asia/Tokyo)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGCONNECT_TIMEOUT: "15"
      STG_URL: ${{ secrets.STG_PING_DATABASE_URL }}
      PROD_URL: ${{ secrets.PROD_PING_DATABASE_URL }}
    steps:
      - name: Generate current month fee records
        id: gen
        run: |
          failed_envs=""
          for env_name in STG PROD; do
            url_var="${env_name}_URL"
            url="${!url_var}"
            if [ -z "$url" ]; then
              echo "::notice::${env_name}: 接続文字列が未設定のためスキップ"
              continue
            fi
            if n=$(psql "$url" -tAc "select public.generate_current_fee_records()" 2>&1); then
              echo "${env_name}: ${n} 件作成"
            else
              echo "::error::${env_name}: 生成に失敗しました: ${n}"
              failed_envs="${failed_envs}${failed_envs:+, }${env_name}"
            fi
          done
          echo "failed=${failed_envs}" >> "$GITHUB_OUTPUT"
          [ -z "$failed_envs" ] || exit 1
      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.gen.outputs.failed }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL が未設定のため通知をスキップ(#10 で設定)"
            exit 0
          fi
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ 月謝レコードの生成が失敗しました(対象: ${FAILED:-不明}): ${RUN_URL}\"}" \
            "$WEBHOOK" \
            || echo "::warning::Discord への通知送信に失敗しました"
